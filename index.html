<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#edf1f9" />
  <title>法語字母發音練習｜French Letter Pronunciation Trainer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&family=Noto+Sans:wght@500&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="plaque plaque-mark" aria-hidden="true" lang="fr">é</span>
      <h1 id="app-title"></h1>
    </div>
    <nav class="tabs">
      <button type="button" id="tab-keyboard" class="active" aria-pressed="true"></button>
      <button type="button" id="tab-game" aria-pressed="false"></button>
    </nav>
  </header>

  <main>
    <section id="view-keyboard" class="view active">
      <div class="layout">
        <div id="keyboard-container" class="keyboard-dock"></div>
        <div id="panel-container" class="panel-area">
          <div class="panel panel-empty">
            <p class="empty-title">
              <span class="lang-zh" lang="zh-Hant">點一個字母，看看、聽聽它怎麼唸</span>
              <span class="lang-en" lang="en">Tap a letter to see and hear how it sounds</span>
            </p>
            <p class="empty-hint">
              <span class="key key-accent key-sample" aria-hidden="true" lang="fr">é</span>
              <span>
                <span class="lang-zh" lang="zh-Hant">黃色的鍵是有重音符號的字母</span>
                <span class="lang-en" lang="en">Yellow keys are letters with accents</span>
              </span>
            </p>
          </div>
        </div>
      </div>
    </section>

    <section id="view-game" class="view">
      <div id="game-container"></div>
    </section>
  </main>

  <script src="js/i18n.js"></script>
  <script src="js/layout.js"></script>
  <script src="data/letters.js"></script>
  <script src="js/keyboard.js"></script>
  <script src="js/tts.js"></script>
  <script src="js/panel.js"></script>
  <script src="js/game.js"></script>
  <script src="js/game-ui.js"></script>
  <script>
    document.getElementById('app-title').innerHTML = I18n.renderBilingual(
      { en: 'French Letter Pronunciation Trainer', zh: '法語字母發音練習' }
    );
    document.getElementById('tab-keyboard').innerHTML = I18n.renderBilingual({ en: 'Keyboard', zh: '鍵盤' });
    document.getElementById('tab-game').innerHTML = I18n.renderBilingual({ en: 'Game', zh: '遊戲' });

    const keyboardContainer = document.getElementById('keyboard-container');
    const panelContainer = document.getElementById('panel-container');
    Keyboard.render(keyboardContainer, window.LETTERS_DATA);

    function findLetter(id) {
      return window.LETTERS_DATA.find((l) => l.id === id);
    }

    Keyboard.onKeyPress(keyboardContainer, (letterId) => {
      const letter = findLetter(letterId);
      Keyboard.setSelected(keyboardContainer, letterId);
      Panel.render(panelContainer, letter);
      if (panelContainer.getBoundingClientRect().top < 0) panelContainer.scrollIntoView({ block: 'start' });
    });
    Panel.onPlay(panelContainer, (text, opts) => Tts.speakText(text, opts));

    const tabKeyboardBtn = document.getElementById('tab-keyboard');
    const tabGameBtn = document.getElementById('tab-game');
    const viewKeyboard = document.getElementById('view-keyboard');
    const viewGame = document.getElementById('view-game');
    let gameStarted = false;

    function activateTab(name) {
      tabKeyboardBtn.classList.toggle('active', name === 'keyboard');
      tabGameBtn.classList.toggle('active', name === 'game');
      tabKeyboardBtn.setAttribute('aria-pressed', String(name === 'keyboard'));
      tabGameBtn.setAttribute('aria-pressed', String(name === 'game'));
      viewKeyboard.classList.toggle('active', name === 'keyboard');
      viewGame.classList.toggle('active', name === 'game');
      if (name === 'game' && !gameStarted) {
        gameStarted = true;
        GameUI.init(document.getElementById('game-container'), window.LETTERS_DATA);
      }
    }

    tabKeyboardBtn.addEventListener('click', () => activateTab('keyboard'));
    tabGameBtn.addEventListener('click', () => activateTab('game'));
  </script>
</body>
</html>
