<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#edf1f9" />
  <title>法語發音練習｜French Pronunciation Trainer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&family=Noto+Sans:wght@500&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1 class="sr-only">法語發音練習 <span lang="en">French Pronunciation Trainer</span></h1>
  <header class="app-header">
    <button type="button" class="section-switch" id="section-switch" aria-haspopup="dialog" aria-expanded="false" aria-controls="section-sheet">
      <span class="glyph" id="section-glyph" lang="fr" aria-hidden="true"></span>
      <span class="bar-name" id="section-name"></span>
      <svg class="chev" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 9.5l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <nav class="seg-mini" id="mode-switch" aria-label="模式 Mode">
      <button type="button" data-mode="learn" aria-pressed="false">學習<span class="sr-only" lang="en"> Learn</span></button>
      <button type="button" data-mode="quiz" aria-pressed="false">測驗<span class="sr-only" lang="en"> Quiz</span></button>
    </nav>
  </header>

  <main>
    <section class="view" data-view="letters-learn">
      <div class="layout">
        <div class="keyboard-dock"></div>
        <div class="panel-area">
          <div class="panel panel-empty">
            <p class="empty-title">
              <span class="lang-zh" lang="zh-Hant">點一個字母，看看、聽聽它怎麼唸</span>
              <span class="lang-en" lang="en">Tap a letter to see and hear how it sounds</span>
            </p>
            <p class="empty-hint">
              <span class="key key-accent key-sample" aria-hidden="true" lang="fr">é</span>
              <span>
                <span class="lang-zh" lang="zh-Hant">黃色的鍵是有重音符號的字母</span>
                <span class="lang-en" lang="en">Yellow keys are letters with accents</span>
              </span>
            </p>
          </div>
        </div>
      </div>
    </section>
    <section class="view" data-view="letters-quiz"><div class="game-root"></div></section>
    <section class="view" data-view="numbers-learn"><div class="num-root"></div></section>
    <section class="view" data-view="numbers-quiz"><div class="num-root"></div></section>
  </main>

  <div class="sheet-layer" id="section-sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-grip" aria-hidden="true"></div>
      <p class="sheet-title" id="sheet-title">
        <span class="lang-zh" lang="zh-Hant">法語發音練習</span>
        <span class="lang-en" lang="en">French Pronunciation Trainer</span>
      </p>
      <ul class="sheet-list"></ul>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/layout.js"></script>
  <script src="data/letters.js"></script>
  <script src="js/keyboard.js"></script>
  <script src="js/tts.js"></script>
  <script src="js/panel.js"></script>
  <script src="js/game.js"></script>
  <script src="js/game-ui.js"></script>
  <script src="js/numbers.js"></script>
  <script src="data/number-rules.js"></script>
  <script src="js/numbers-quiz.js"></script>
  <script src="js/numbers-ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
